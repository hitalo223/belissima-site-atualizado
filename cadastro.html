<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar conta — Belíssima Moda Íntima</title>
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">

  <header class="auth-header">
    <a href="loja.html" class="back-link">‹ Voltar à loja</a>
    <div class="logo-block">
      <div class="name">BELÍSSIMA</div>
      <div class="sub">MODA ÍNTIMA</div>
    </div>
    <span class="spacer"></span>
  </header>

  <main class="auth-main">
    <div class="auth-card">
      <div class="eyebrow">SEJA BEM-VINDA</div>
      <h1>Criar sua conta</h1>

      <form id="cadastro-form" class="auth-form" novalidate>
        <label>
          Nome
          <input type="text" name="nome" required autocomplete="name" placeholder="Seu nome">
        </label>
        <label>
          E-mail
          <input type="email" name="email" required autocomplete="email" placeholder="voce@email.com">
        </label>
        <label>
          Senha
          <input type="password" name="password" required autocomplete="new-password" placeholder="Mínimo 6 caracteres">
        </label>
        <label>
          Confirmar senha
          <input type="password" name="confirmar" required autocomplete="new-password" placeholder="Repita a senha">
        </label>
        <div class="auth-message" id="cadastro-message"></div>
        <button type="submit" class="auth-submit">CRIAR CONTA</button>
      </form>

      <div class="auth-divider"><span>ou</span></div>

      <button type="button" class="auth-google" id="google-cadastro-btn">
        <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <path fill="#FFC107" d="M43.6 20.5H42V20.5H24v7h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5-5C33.6 6.1 29.1 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.4-.4-3.5z"/>
          <path fill="#FF3D00" d="M6.3 14.7l5.8 4.2C13.6 15.1 18.4 12 24 12c3.1 0 5.9 1.2 8 3.1l5-5C33.6 6.1 29.1 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 44c5 0 9.5-1.9 12.9-5.1l-5.9-5c-1.9 1.4-4.4 2.1-7 2.1-5.3 0-9.7-3.4-11.3-8l-6 4.6C9.6 39.7 16.3 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20.5H24v7h11.3c-.8 2.2-2.2 4.1-4.2 5.4l5.9 5C40.7 34.9 44 30 44 24c0-1.2-.1-2.4-.4-3.5z"/>
        </svg>
        Continuar com Google
      </button>

      <p class="auth-switch">Já tem conta? <a href="login.html">Entrar</a></p>

      <p class="auth-hint">Ao criar sua conta, você concorda em receber e-mails da Belíssima sobre seus pedidos. Nada de spam.</p>
    </div>
  </main>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
